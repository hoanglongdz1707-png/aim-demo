<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aim Assist Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:radial-gradient(circle,#202020,#080808)}
#ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:2}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700}
#status{color:#fff;background:#0009;padding:9px 12px;border-radius:12px;font-size:13px}
#help{position:fixed;bottom:12px;left:12px;right:12px;color:#ddd;background:#0008;padding:10px;border-radius:12px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div id="ui">
  <button id="toggle">Aim Assist: ON</button>
  <div id="status">Mục tiêu: —</div>
</div>
<canvas id="game"></canvas>
<div id="help">Demo độc lập: chạm màn hình để di chuyển mục tiêu. Tâm sẽ tự kéo mượt về mục tiêu.</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const toggle=document.getElementById("toggle");
const status=document.getElementById("status");

let W,H,dpr;
let aimAssist=true;
let cross={x:0,y:0};
let target={x:0,y:0,r:25,vx:1.7,vy:1.2};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!cross.x){cross.x=W/2;cross.y=H/2}
  target.x=Math.min(Math.max(target.x,target.r),W-target.r);
  target.y=Math.min(Math.max(target.y,target.r+55),H-target.r-20);
}
addEventListener("resize",resize);
resize();

toggle.onclick=()=>{
  aimAssist=!aimAssist;
  toggle.textContent="Aim Assist: "+(aimAssist?"ON":"OFF");
};

canvas.addEventListener("pointerdown",e=>{
  target.x=e.clientX;
  target.y=e.clientY;
  target.vx=(Math.random()<.5?-1:1)*(1.2+Math.random()*1.5);
  target.vy=(Math.random()<.5?-1:1)*(1.0+Math.random()*1.5);
});

function nearestTarget(){
  const dx=target.x-cross.x,dy=target.y-cross.y;
  return Math.hypot(dx,dy);
}

function update(){
  target.x+=target.vx;
  target.y+=target.vy;
  if(target.x<target.r||target.x>W-target.r)target.vx*=-1;
  if(target.y<target.r+55||target.y>H-target.r)target.vy*=-1;

  if(aimAssist){
    const smooth=.09;
    cross.x+=(target.x-cross.x)*smooth;
    cross.y+=(target.y-cross.y)*smooth;
  }
}

function drawCrosshair(){
  ctx.save();
  ctx.translate(cross.x,cross.y);
  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,0,18,0,Math.PI*2);
  ctx.moveTo(-28,0);ctx.lineTo(-8,0);
  ctx.moveTo(8,0);ctx.lineTo(28,0);
  ctx.moveTo(0,-28);ctx.lineTo(0,-8);
  ctx.moveTo(0,8);ctx.lineTo(0,28);
  ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.fillStyle="#e33";
  ctx.beginPath();
  ctx.arc(target.x,target.y,target.r,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff8";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(target.x,target.y,target.r+6,0,Math.PI*2);
  ctx.stroke();

  drawCrosshair();

  const d=Math.round(nearestTarget());
  status.textContent="Khoảng cách tâm → mục tiêu: "+d+" px";
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
